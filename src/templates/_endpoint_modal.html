<div class="modal fade" id="endpointModal" tabindex="-1" aria-labelledby="endpointModalTitle" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
    <form class="modal-content" id="endpointForm" novalidate>
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="endpointModalTitle">Новый эндпоинт</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body">
        <p class="text-body-secondary small mb-2">Эндпоинт в <strong id="ep-scope-name" class="text-body"></strong></p>

        <div class="input-group request-bar">
          <button class="btn dropdown-toggle method-btn" id="ep-method-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Метод запроса" data-method="GET">GET</button>
          <ul class="dropdown-menu">
            {% for m in METHODS %}
            <li><button class="dropdown-item ep-method-item m-{{ m }}" type="button" data-method="{{ m }}">{{ m }}</button></li>
            {% endfor %}
          </ul>
          <input id="ep-path" class="form-control font-monospace" placeholder="Путь эндпоинта, например /users/1" autocomplete="off" spellcheck="false" aria-label="Путь эндпоинта">
        </div>
        <div class="invalid-feedback d-block" id="ep-err-path" hidden></div>
        <div class="alert alert-danger mt-2 mb-0" id="ep-server-error" role="alert" hidden></div>

        <div class="card mt-3">
          <div class="card-body">
            <h3 class="fs-6 fw-bold mb-3">Параметры для эндпоинта <span class="fw-normal small text-body-secondary ms-2">заголовки ответа</span></h3>
            <table class="table table-sm kv mb-0">
              <thead><tr><th scope="col">Ключ</th><th scope="col">Значение</th><th scope="col" class="kv-del"><span class="visually-hidden">Действия</span></th></tr></thead>
              <tbody id="ep-headers-body"></tbody>
            </table>
            <div class="invalid-feedback d-block" id="ep-err-headers" hidden></div>
          </div>
        </div>

        <div class="card mt-3">
          <div class="card-body">
            <h3 class="fs-6 fw-bold mb-3">HTTP-ответ</h3>
            <div class="row g-3 mb-3">
              <div class="col-auto">
                <div class="form-label small fw-semibold text-body-secondary" id="ep-scenario-label">Сценарий</div>
                <div class="btn-group" role="radiogroup" aria-labelledby="ep-scenario-label">
                  {% for s in SCENARIOS %}
                  <input type="radio" class="btn-check" name="ep-scenario" id="ep-scenario-{{ s }}" value="{{ s }}" autocomplete="off">
                  <label class="btn {% if s == 'FAILURE' %}btn-outline-danger{% else %}btn-outline-primary{% endif %} font-monospace btn-sm" for="ep-scenario-{{ s }}">{{ s }}</label>
                  {% endfor %}
                </div>
              </div>
              <div class="col-auto">
                <label class="form-label small fw-semibold text-body-secondary" for="ep-status">Статус</label>
                <div class="d-flex align-items-center gap-2">
                  <input id="ep-status" class="form-control form-control-sm font-monospace status-input" inputmode="numeric" maxlength="3">
                  <span class="small text-body-secondary" id="ep-status-text"></span>
                </div>
              </div>
              <div class="col-auto">
                <div class="form-label small fw-semibold text-body-secondary" id="ep-active-label">Приём запросов</div>
                <div class="form-check form-switch pt-1" title="Выключенный эндпоинт отвечает 404">
                  <input class="form-check-input" type="checkbox" role="switch" id="ep-active" aria-labelledby="ep-active-label">
                  <label class="form-check-label" for="ep-active" id="ep-active-text"></label>
                </div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-baseline">
              <label class="form-label small fw-semibold text-body-secondary" for="ep-body">Тело ответа (JSON)</label>
              <button type="button" class="btn btn-link btn-sm p-0" id="ep-format-body">Форматировать</button>
            </div>
            <textarea id="ep-body" class="form-control font-monospace body-input" rows="8" spellcheck="false" aria-describedby="ep-body-state"></textarea>
            <p class="small mt-2 mb-0" id="ep-body-state"></p>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
        <button type="submit" class="btn btn-primary" id="ep-save-btn">Создать</button>
      </div>
    </form>
  </div>
</div>
