<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mock API Engine{% endblock %}</title>
  <script>
    document.documentElement.dataset.bsTheme =
      window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/app.css" rel="stylesheet">
</head>
<body>
  <div class="app">
    {% include "_sidebar.html" %}
    <main class="main">
      {% block content %}{% endblock %}
    </main>
  </div>

  <div id="toasts" class="position-fixed bottom-0 end-0 p-3" role="status" aria-live="polite"></div>

  <!-- Общее модальное окно для действий из сайдбара -->
  <div class="modal fade" id="actionModal" tabindex="-1" aria-labelledby="actionModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content" id="actionForm">
        <div class="modal-header">
          <h2 class="modal-title fs-5" id="actionModalTitle"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body" id="actionBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Отмена</button>
          <button type="submit" class="btn btn-primary" id="actionConfirm"></button>
        </div>
      </form>
    </div>
  </div>

  <script type="application/json" id="app-data">{{ app_data|tojson }}</script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
